name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Permisos mínimos: solo lectura del código, sin secretos ni despliegue.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 y caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Build de producción
        run: npm run build
